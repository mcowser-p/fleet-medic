---
# Canonical rolling patch: one host at a time, stop the wave on the
# first host whose health gates fail.
- name: Fleet medic — patch and reboot
  hosts: all
  become: true
  serial: 1
  any_errors_fatal: true
  roles:
    - role: mcowser_p.fleet_medic.patch_reboot
      vars:
        fleet_medic_patch_security_only: "{{ security_only | default(false) }}"
        fleet_medic_patch_reboot: "{{ reboot | default('if_needed') }}"
        fleet_medic_patch_datadog_api_key: "{{ datadog_api_key | default('') }}"
