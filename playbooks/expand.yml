---
# The Ascender job template entry point for Datadog-triggered expansion.
# The webhook only needs to set the limit/host — the role sweeps all
# mounts.
- name: Fleet medic — disk expansion
  hosts: all
  become: true
  roles:
    - role: mcowser_p.fleet_medic.disk_expand
      vars:
        fleet_medic_expand_dry_run: "{{ dry_run | default(false) }}"
        fleet_medic_expand_datadog_api_key: "{{ datadog_api_key | default('') }}"
